# ── Identity ─────────────────────────────────────────────────────────────
service:
  name: "default-app"          # set by the pipeline via --set service.name
  port: 8080
  protocol: TCP

environment: dev               # set by the pipeline via --set environment
cloud: ""                      # aws | gcp | azure — set by the pipeline; picks the internal-LB annotation

# ── Image ────────────────────────────────────────────────────────────────
image:
  repository: ""               # set by the pipeline via --set image.repository
  tag: latest                  # set by the pipeline via --set image.tag
  pullPolicy: IfNotPresent

# ── Scaling ──────────────────────────────────────────────────────────────
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# ── Resources (cheapest viable defaults) ─────────────────────────────────
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# ── Probes ───────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# ── ServiceAccount + Workload Identity ──────────────────────────────────
serviceAccount:
  create: true
  annotations: {}              # GCP WI:  iam.gke.io/gcp-service-account: <sa-email>
                               # AWS IRSA: eks.amazonaws.com/role-arn: <role-arn>

# ── Ingress (platform-owned) ─────────────────────────────────────────────
# Exposure belongs to bootstrap: it installs the ingress controller and the DNS
# controller, and these values arrive from its outputs via the deploy pipeline.
# A service sets none of this.
#
# The Ingress renders whenever `service.internalDomain` is set — the same switch
# that used to turn the Service into a LoadBalancer. There is no `enabled` flag
# any more: a project with a private domain gets a host, one without gets
# ClusterIP and in-cluster traffic only.
ingress:
  # IngressGroup / shared load balancer name. AWS merges every Ingress sharing a
  # group into ONE ALB; passed from bootstrap's `ingress_group_name` output.
  groupName: ""
  # Overrides the per-cloud default class (alb / gce-internal /
  # azure-application-gateway) when a project runs its own controller.
  className: ""
  # The load balancer's own health check. Distinct from the pod probes: the LB
  # needs a path that answers before it puts the target in service.
  healthcheckPath: /health
  annotations: {}
  tls: []

# ── Schema-driven env injection ─────────────────────────────────────────
# Populated by the parse-env-schema composite action from .env.example.
# Manual overrides are allowed but not recommended — keep the contract in
# .env.example and let CI fill these in.
envLiterals: {}                # { KEY: "value", … } → ConfigMap data
envParams: []                  # [ { key, source, path, store, [field] } ]
envSecrets: []                 # [ { key, source, path, store, [field] } ]
secretStoreRefs: []            # [ "cloud-default", "vault-default", … ]

externalSecretRefreshInterval: 1h

# ── Pod-level extras ─────────────────────────────────────────────────────
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
imagePullSecrets: []
