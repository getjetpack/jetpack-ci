apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- /*
    Always ClusterIP.

    Exposure is the platform's job, not a per-service one: bootstrap installs
    an ingress controller and a DNS controller, and `ingress.yaml` below asks
    them for a hostname. A `type: LoadBalancer` Service here used to give every
    service its own cloud load balancer — one bill and one set of listeners per
    service, with the service owning infrastructure it should never have known
    about.

    `ingress.enabled` is false only when a project has no internal domain, in
    which case nothing can be published and in-cluster traffic is all there is.
  */}}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: {{ .Values.service.protocol }}
      name: http
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
